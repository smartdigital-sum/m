<main>
    <section class="sd-hero" style="padding-bottom:40px;">

            <span class="sd-eyebrow" data-en="Updates" data-as="আপডেট">Updates</span>
            <h1 class="sd-h1" style="font-size:clamp(30px,4.4vw,48px);" data-en="Launches, case studies and announcements" data-as="উদ্বোধন, কেছ ষ্টাডী আৰু ঘোষণা">Launches, case studies and announcements</h1>

    <section class="sd-section" style="padding-top:0;">
        <div class="sd-container" style="max-width:760px;">
            <div class="sd-notice-list sd-reveal" id="sdNoticeList"></div>
            <div class="sd-notice-empty" id="sdNoticeEmpty" style="display:none;" data-en="Nothing posted yet — check back soon." data-as="এতিয়াও কিবা প'ষ্ট কৰা হোৱা নাই — সোনকালে পুনৰ চাওক।">Nothing posted yet — check back soon.</div>

    <section class="sd-section sd-section--alt">

                <h3 class="sd-h3" style="font-size:15px; text-align:center;" data-sd-admin-label>Admin login</h3>
                <form data-sd-admin-login class="sd-form" style="display:grid;">
                    <input type="password" name="adminPwd" placeholder="Admin password" autocomplete="current-password" style="padding:10px 12px; border-radius:8px; border:1px solid var(--sd-border); background:var(--sd-surface); color:var(--sd-ink);">
                    <button class="sd-btn sd-btn--outline sd-btn--sm" type="submit">Sign in</button>
                </form>
                <form data-sd-admin-add class="sd-admin-add" style="display:none;">
                    <select name="noticeType" style="padding:10px; border-radius:8px; border:1px solid var(--sd-border); background:var(--sd-surface); color:var(--sd-ink);">
                        <option value="info">📢 Info</option>
                        <option value="success">✅ Success</option>
                        <option value="warning">⚠️ Warning</option>
                        <option value="event">🎉 Event</option>
                    </select>
                    <input type="text" name="noticeText" placeholder="Post an update..." style="padding:10px 12px; border-radius:8px; border:1px solid var(--sd-border); background:var(--sd-surface); color:var(--sd-ink);">
                    <button class="sd-btn sd-btn--primary sd-btn--sm" type="submit">Post</button>
                </form>
                <div style="text-align:center; margin-top:10px;">
                    <button class="sd-btn sd-btn--outline sd-btn--sm" type="button" data-sd-admin-logout style="display:none;">Sign out</button>
                </div>
            </div>
